<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ページが見つかりません｜福原AI研究所</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: #f7f8fa;
        color: #1f2733;
        font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
        line-height: 1.9;
        text-align: center;
      }
      .code {
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: #0f7490;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        color: #12233f;
        line-height: 1.4;
        margin-bottom: 1rem;
        letter-spacing: -0.015em;
      }
      p {
        font-size: 0.9375rem;
        color: #4a5563;
        margin-bottom: 2rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem 1.75rem;
        background: #12233f;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 700;
        text-decoration: none;
        border-radius: 2px;
        transition: background 0.2s;
      }
      a:hover { background: #1c3559; }
      .brand {
        margin-top: 2.5rem;
        font-size: 0.75rem;
        color: #6b7684;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 Not Found</p>
      <h1>ページが見つかりませんでした</h1>
      <p>
        お探しのページは移動または削除された可能性があります。<br />
        トップページからご覧ください。
      </p>
      <a href="/">トップページへ戻る</a>
      <p class="brand">福原AI研究所 / FUKUHARA AI LAB</p>
    </main>
  </body>
</html>
