# =========================================================
# 応募者プロフィール設定
# =========================================================
#
# このファイルをコピーして profile.yaml を作成してください。
#
# ★ ここが応募文生成の「唯一の情報源」です ★
# このファイルを編集するだけで、以後すべての応募文にすぐ反映されます。
# コード(src/以下)を触る必要は一切ありません。
#
# [必須項目]
#   name      : あなたの名前(応募文の署名に使われます)
#   strengths : 強み・実績のリスト(1つ以上)
#
# [任意項目]
#   title               : 肩書き・キャッチコピー
#   portfolio             : 実績のリスト(name/url/noteのオブジェクトを並べる)。
#                            個々の制作物ごとにURLを登録する必要はありません。
#                            制作実績をまとめて紹介している公式サイト・ポートフォリオ
#                            サイトが1つあるなら、それを1件だけ登録するのがおすすめです。
#                            url が実在しない場合(example.com等のプレースホルダー)は
#                            応募文生成時に自動的に除外されます。
#   availability.hours    : 稼働可能時間
#   availability.scope    : 対応可能な業務範囲
#   extraNotes            : その他アピールしたいこと(リスト)
#   sampleApplication      : ★応募文の基本テンプレート(あなたが実際に使う原文)★
#                            AIはこの文章の構成・文体・自己紹介・実績紹介・進め方・締めを
#                            基本的に維持したまま、案件ごとに必要な部分だけを編集します。
#                            全体をゼロから書き直すことはしません。
#   applicationRules       : 応募文作成時に常に守ってほしいルール(自由記述)。
#                            クライアント指定の質問・フォーマットを優先する、
#                            文字数制限を守る、等をここに書いてください。

name: "あなたの名前"
title: "肩書き・キャッチコピー(任意)"

strengths:
  - "強み・実績1"
  - "強み・実績2"

portfolio:
  - name: "公式サイト・ポートフォリオサイト"
    url: "https://example.com/your-portfolio"
    note: "制作実績や業務ツールをまとめて掲載しているサイト"

availability:
  hours: "稼働可能時間(例: 平日夜・週末中心、週10時間程度)"
  scope: "対応可能な業務範囲(例: ヒアリング〜設計〜実装〜納品まで)"

extraNotes:
  - "その他アピールしたいこと"

sampleApplication: |
  (ここに、実際に使いたい応募文の原文をそのまま貼り付けてください。
  挨拶・自己紹介・実績紹介・進め方・締めなど、案件によらず使い回したい
  文章をそのまま書けば、AIはこれを土台に案件ごとの部分だけを編集します)

applicationRules: |
  (ここに、応募文作成時に常に守ってほしいルールを箇条書きで書いてください。
  例: クライアント指定の質問・フォーマットを最優先する、文字数制限を守る、
  「AIを活用して」という表現は使わない、等)
